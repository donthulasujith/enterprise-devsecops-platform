name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto app/juice-shop

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app/juice-shop
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Security gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app/juice-shop
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: app/juice-shop/.trivyignore
          exit-code: '1'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t juice-shop:dev app/juice-shop

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop:dev
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif

      # =========================
      # DAST - OWASP ZAP
      # =========================

      - name: Create DAST network
        run: docker network create zap-net

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop-dast \
            --network zap-net \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            juice-shop:dev

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if docker run --rm \
              --network zap-net \
              curlimages/curl:8.10.1 \
              -fsS http://juice-shop-dast:3000 >/dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 2
          done

          echo "Juice Shop failed to become ready"
          docker logs juice-shop-dast
          exit 1

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run OWASP ZAP Full Scan
        continue-on-error: true
        run: |
          mkdir -p zap-reports

          docker run --rm \
            --network zap-net \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://juice-shop-dast:3000 \
            -r zap-full-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-reports/zap-full-report.html
          if-no-files-found: warn

      - name: Cleanup DAST containers
        if: always()
        run: |
          docker rm -f juice-shop-dast 2>/dev/null || true
          docker network rm zap-net 2>/dev/null || true

  checkov:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s
          framework: kubernetes
          soft_fail: true
